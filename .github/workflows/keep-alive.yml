name: Keep AlphaDesk awake

# Render's free tier spins the app down after ~15 minutes of no traffic;
# the next visitor then has to wait through a cold boot (30-60+ seconds).
# Pinging it regularly keeps it warm so real users never hit that delay.
# Free - GitHub Actions minutes for a scheduled job this short are well
# within the free monthly allowance.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping AlphaDesk
        run: curl -s -o /dev/null -w "HTTP %{http_code}\n" https://alphadesk-0an5.onrender.com/
